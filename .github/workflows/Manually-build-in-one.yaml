name: Manually-build-in-one

on:
  workflow_dispatch:  # 手动触发
  repository_dispatch:  # 通过 repository_dispatch 触发
    types: [trigger-by-prebuilder]

jobs:
  build_pull_request:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-26
        abi:
          #- armeabi-v7a
          - arm64-v8a
          #- x86
          #- x86_64
    env:
      BUILD_ABI: ${{ matrix.abi }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update specific submodules to latest commit
        run: |
          git -C plugin/rime/src/main/cpp/fcitx5-rime fetch origin master && git -C plugin/rime/src/main/cpp/fcitx5-rime reset --hard origin/master
          git -C lib/fcitx5/src/main/cpp/prebuilt fetch origin master && git -C lib/fcitx5/src/main/cpp/prebuilt reset --hard origin/master

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Install system dependencies (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install extra-cmake-modules

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :assembleReleasePlugins

      - name: Move app and plugins to one dir
        shell: bash
        run: |
          mkdir app-and-plugins
          mv app/build/outputs/apk/release/* app-and-plugins/
          find plugin/*/build/outputs/apk/release -type f -print0 | while IFS= read -r -d '' source_file; do
            # 获取第二级目录名作为前缀 
            prefix=$(basename "$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$source_file")")")")")")
            # 获取文件名 
            filename=$(basename "$source_file") 
            # 构建目标文件路径，加上前缀
            target_file="app-and-plugins/$prefix"_"$filename"
            mv "$source_file" "$target_file"
          done

      - name: Sign app and plugins
        uses: kevin-david/zipalign-sign-android-release@v2
        #uses: rpavlik/sign-android-release@master
        id: sign_apk
        with:
          releaseDirectory: app-and-plugins
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload app and plugins
        uses: actions/upload-artifact@v7
        with:
          name: app&plugins-${{ matrix.os }}-${{ matrix.abi }}
          path: app-and-plugins/*-signed.apk

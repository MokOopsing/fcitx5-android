name: Manually build and sign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install native build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Release APK
        run: ./gradlew --build-cache :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir app-release
          mapfile -d '' -t apks < <(find app/build/outputs/apk -type f -name '*.apk' -print0)
          if ((${#apks[@]} == 0)); then
            echo "No APKs found under app/build/outputs/apk" >&2
            exit 1
          fi
          mv "${apks[@]}" app-release/

      - name: Sign APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_apk
        with:
          releaseDirectory: app-release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "36.1.0"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: youmo-ime-signed
          path: app-release/*-signed.apk

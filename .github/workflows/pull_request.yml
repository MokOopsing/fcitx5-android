name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

permissions:
  contents: read

# a newer push makes the builds of the one before it pointless
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pull_request:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - macos-26
          - windows-2025
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # the engine data is unpacked with the SDK's CMake before AGP would install it for the native
      # build; the version is the build's own. pwsh: one script for all four, sdkmanager.bat found
      - name: Install CMake
        shell: pwsh
        run: |
          $cmake = (Select-String -Path build-logic/convention/src/main/kotlin/Versions.kt -Pattern 'defaultCMake = "([^"]+)"').Matches[0].Groups[1].Value
          sdkmanager --install "cmake;$cmake"

      - name: Install system dependencies (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Install system dependencies (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install extra-cmake-modules

      - name: Install system dependencies (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-ucrt-x86_64-gettext mingw-w64-ucrt-x86_64-extra-cmake-modules
          Add-Content $env:GITHUB_PATH "C:/msys64/ucrt64/bin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # libime's sources, the engine-data release's model and the sentence models, some 400 MB:
      # keyed on EngineDataPlugin, which names them and their SHA-256. Paths as in every workflow,
      # or the caches nix.yml saves on main would not be found here
      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      - name: Build Release APK
        run: ./gradlew --build-cache :app:assembleTextRelease

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: app/build/outputs/apk/*/release/

  # the voice build: its own code (src/voice) and sherpa-onnx's native build with our changes,
  # through R8. One OS and one ABI, as neither changes what it checks
  build_voice:
    runs-on: ubuntu-24.04
    # emulator_test's cap, whose voice run builds the same native code for one ABI and runs the tests
    # too: a hung build does not hold the runner for the 6-hour default
    timeout-minutes: 60
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install CMake
        shell: pwsh
        run: |
          $cmake = (Select-String -Path build-logic/convention/src/main/kotlin/Versions.kt -Pattern 'defaultCMake = "([^"]+)"').Matches[0].Groups[1].Value
          sdkmanager --install "cmake;$cmake"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      # the recognizer's model and the VAD, keyed on VoiceDataPlugin, which names them
      - name: Cache voice model downloads
        uses: actions/cache@v6
        with:
          path: .gradle/engine-downloads/voice
          key: voice-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/VoiceDataPlugin.kt') }}

      - name: Build Voice Release APK
        run: ./gradlew --build-cache :app:assembleVoiceRelease

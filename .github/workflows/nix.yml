name: Nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# as unit_test.yml: a pull request's newer push cancels its run in flight, a push to main runs alone
concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      # no binary cache but nixos.org's: upstream's fcitx5-android one is not this project's to trust.
      # The token (read-only, above) spares the flake's github: inputs the API's rate limit
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # as pull_request.yml's, whose runs find the ones saved here on main
      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}
      # no --build-cache, unlike the other workflows: without setup-gradle no ~/.gradle outlives the run,
      # so the cache's entries (some 380 MB of engine data and assets) would be written and never read
      - name: Build Release APK
        run: |
          nix develop .#noAS --command ./gradlew :app:assembleTextRelease

name: Unit Tests

# JVM unit tests, the lexicon tools' Python tests, and the C++ tests of our sherpa-onnx changes and
# of native-lib's helpers, built with the host's compiler (the host-test.sh scripts).
# Deliberately separate from the build workflow:
#   - no submodules (verified: `:app:testTextDebugUnitTest` configures and runs on a submodule-free checkout)
#   - no NDK, no CMake (the task graph for `:app:testTextDebugUnitTest` contains no native tasks)
#   - single OS
# so it takes a few minutes rather than the build jobs' half hour, and can gate every push.
#
# Java 17, like the jobs that build APKs here (pull_request, emulator_test): tests
# run on the JDK the release is built with. Bytecode target is Java 11 either way
# (build-logic/convention/src/main/kotlin/Versions.kt).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request makes an in-flight run pointless, so a PR shares one group and
# cancels. A push to main gets a group of its own (per commit): a shared group would still
# drop queued runs beyond the first, and with them the results of commits in a burst.
concurrency:
  group: unit-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  unit_test:
    name: JVM unit tests
    runs-on: ubuntu-24.04
    # was 20 before the voice flavour's compile (a second one of the app) and the host tests
    timeout-minutes: 30
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          # full history like pull_request.yml: build-logic runs `git describe` at configuration
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Robolectric fetches its android-all jars (hundreds of MB, one per SDK the tests run at)
      # into the Maven local repository, which the Gradle cache does not cover
      - name: Cache Robolectric runtimes
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: robolectric-

      # :lib:ime-core is a plain JVM module: no Android SDK, no resource merging, seconds to
      # run. Kept as a separate step so a failure there is obviously a logic failure rather
      # than an Android build problem. `check` = tests, the Android API level guard
      # (animal-sniffer, which Android lint cannot provide for a JVM module) and the coverage
      # floors (Kover). :lib:ime-dict-tool, the host tool that builds the engine's data, is
      # plain JVM too; its tests are what covers the mix and the crawl, whose output builds download.
      # Its coverage is reported, with no floor.
      # :lib:ime-eval, the evaluation harness, is a third: its tests drive ime-core's engine API and
      # fail while the sets made from data/pinyin.tsv have not been remade after it changed.
      # :build-logic:convention's tests are the build plugins' own (the data's fingerprints and
      # hashes, detekt's sources).
      # --continue: the coverage report is wanted most when a check has failed
      - name: Run core logic, dict tool and evaluation tests, API level check and coverage floors
        run: ./gradlew --build-cache --continue :lib:ime-core:check :lib:ime-core:koverHtmlReport :lib:ime-dict-tool:test :lib:ime-dict-tool:koverHtmlReport :lib:ime-eval:test :build-logic:convention:test

      # text debug only: the voice flavour's own code is tested by the voice tests in ime-core
      - name: Run app unit tests
        if: success() || failure()
        run: ./gradlew --build-cache :app:testTextDebugUnitTest :app:koverLogTextDebug

      # no other job sees the voice flavour on a push: its own code (src/voice), whose VoiceFeature
      # the text stub has to match, and the unit tests' sources against it
      - name: Compile the voice flavour
        if: success() || failure()
        run: ./gradlew --build-cache :app:compileVoiceDebugUnitTestKotlin

      # the C++ tests of our sherpa-onnx changes (context graph, hotword and blocked-phrase encoding):
      # the runner's g++, with googletest and simple-sentencepiece downloaded SHA-256 checked; no NDK,
      # no CMake
      - name: Run sherpa-onnx host tests
        if: success() || failure()
        run: lib/sherpa-onnx/host-test.sh

      # native-lib's helpers that need neither JNI nor fcitx (UTF-16 to UTF-8), the same way
      - name: Run native-lib host tests
        if: success() || failure()
        run: app/src/test/cpp/host-test.sh

      # the lexicon tools' tests: apply.py is the only check that a curator's readings did not slip a line
      - name: Run lexicon tool tests
        if: success() || failure()
        run: python3 -m unittest discover -s lexicon/tools

      # chat.py's readings of the words a chat line means otherwise, which the chat, dialog and mixed sets are typed by
      - name: Run eval tool tests
        if: success() || failure()
        run: python3 -m unittest discover -s lib/ime-eval/tools

      # After the tests, so a lint finding does not hide their results. Findings already present
      # are frozen in config/detekt/baseline-*.xml; this fails on new ones only.
      # Syntax rules only: type resolution does not work on this toolchain (see detekt.yml).
      - name: Static analysis (detekt)
        if: success() || failure()
        run: ./gradlew --build-cache detekt

      # a failed test shows up on the run page and the checks tab, not only inside the report
      # (without a file and line GitHub cannot place it in the diff; it shows the first 10)
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          def escape(s, prop=False):
              s = s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return s.replace(":", "%3A").replace(",", "%2C") if prop else s
          for path in glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:  # e.g. a test JVM killed mid-write
                  print(f"::warning title=Unreadable test result::{escape(path)}")
                  continue
              for case in root.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      title = escape(f"{case.get('classname')}.{case.get('name')}", prop=True)
                      lines = (bad.get("message") or "").splitlines()
                      text = escape(lines[0] if lines else bad.get("type", "failed"))
                      print(f"::error title={title}::{text}")
          PY

      - name: Upload test report
        # the report is most useful precisely when the tests failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          # detekt checks every Kotlin module (DetektConventionPlugin), so its reports are globbed
          path: |
            lib/ime-core/build/reports/tests/
            lib/ime-core/build/reports/animalsniffer/
            lib/ime-core/build/reports/kover/
            lib/ime-core/build/test-results/
            lib/ime-dict-tool/build/reports/tests/
            lib/ime-dict-tool/build/reports/kover/
            lib/ime-dict-tool/build/test-results/
            lib/ime-eval/build/reports/tests/
            lib/ime-eval/build/test-results/
            build-logic/convention/build/reports/tests/
            build-logic/convention/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            **/build/reports/detekt/
          retention-days: 14
